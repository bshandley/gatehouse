services:
  gatehouse:
    build: .
    container_name: gatehouse
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - gatehouse-data:/data
      - ./config:/config:ro
    environment:
      # REQUIRED: 64-char hex string. Generate with: openssl rand -hex 32
      - GATEHOUSE_MASTER_KEY=${GATEHOUSE_MASTER_KEY}
      # Bootstrap root token. Remove after creating users/AppRoles.
      - GATEHOUSE_ROOT_TOKEN=${GATEHOUSE_ROOT_TOKEN:-gatehouse-root-changeme}
      # Allow proxying to private/LAN IPs (10.x, 192.168.x, etc.)
      # Required for most homelab setups where services are on local network.
      # Without this, proxy requests to LAN addresses return 403 SSRF block.
      - GATEHOUSE_PROXY_ALLOW_PRIVATE=${GATEHOUSE_PROXY_ALLOW_PRIVATE:-false}
      # Log level: debug, info, or error
      - GATEHOUSE_LOG_LEVEL=${GATEHOUSE_LOG_LEVEL:-info}
      # Public URL used when generating onboarding links. Set when Gatehouse
      # runs behind a reverse proxy or on a LAN IP and the inbound Host
      # header isn't the address you want agents to fetch. Takes precedence
      # over X-Forwarded-Host. Leave unset to fall back to the request host.
      - GATEHOUSE_PUBLIC_URL=${GATEHOUSE_PUBLIC_URL:-}
      # LAN-only URL for split-DNS deployments. When set alongside
      # GATEHOUSE_PUBLIC_URL, the admin UI defaults new onboarding links to
      # this URL (LAN agents get the fast path) and the bootstrap doc
      # fetched via the internal host renders LAN URLs in every curl
      # example. Leave unset if you don't have a split-DNS setup.
      - GATEHOUSE_INTERNAL_URL=${GATEHOUSE_INTERNAL_URL:-}
      # CORS origins (comma-separated). Only needed behind a reverse proxy.
      # - GATEHOUSE_CORS_ORIGINS=https://gatehouse.yourdomain.com
      # Optional: OIDC SSO bootstrap. These env vars seed the settings/sso DB
      # row on FIRST boot if no row exists. After that, the database is the
      # single source of truth and these vars are ignored. Configure SSO from
      # the web UI (Settings -> SSO / OAuth Configuration) once you're up.
      # Leave these commented unless you want to automate first-boot setup.
      # - GATEHOUSE_OAUTH_ISSUER=https://id.yourdomain.com
      # - GATEHOUSE_OAUTH_CLIENT_ID=gatehouse
      # - GATEHOUSE_OAUTH_CLIENT_SECRET=your-secret
      # - GATEHOUSE_OAUTH_REDIRECT_URI=https://gatehouse.yourdomain.com/v1/auth/sso/callback
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3100/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "homepage.group=Security"
      - "homepage.name=Gatehouse"
      - "homepage.icon=shield-lock"
      - "homepage.href=http://gatehouse.local:3100"
      - "homepage.description=Secrets vault for AI agents"

volumes:
  gatehouse-data:
