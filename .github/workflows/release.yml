name: Create GitHub Release on tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Find the previous v*.*.* tag (lexicographic semver-friendly sort).
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
            COMPARE=""
          else
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          fi

          CURRENT_VER="${TAG#v}"
          PREV_VER="${PREV_TAG#v}"

          # Primary source: CHANGELOG.md sections from this release back to
          # (but not including) the previous tag. This carries the rationale
          # that lives in commit bodies, not just subjects. The sync script
          # bundles multiple Gitea commits into one GitHub release, so any
          # intermediate ## [x.y.z] entries between the previous synced tag
          # and this one are picked up too.
          CHANGELOG_BODY=""
          if [ -f CHANGELOG.md ]; then
            if [ -n "$PREV_VER" ]; then
              CHANGELOG_BODY=$(awk -v cur="$CURRENT_VER" -v prev="$PREV_VER" '
                $0 ~ ("^## \\[" cur "\\]") { found=1 }
                found && $0 ~ ("^## \\[" prev "\\]") { exit }
                found { print }
              ' CHANGELOG.md || true)
            else
              # No previous tag: grab just the current section, stopping at
              # the next ## [...] header.
              CHANGELOG_BODY=$(awk -v cur="$CURRENT_VER" '
                $0 ~ ("^## \\[" cur "\\]") { found=1; print; next }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md || true)
            fi
          fi

          # Commit-subject summary, grouped by conventional-commit type.
          # Always rendered as a supplementary section so operators can see
          # the granular Gitea history that contributed to this release.
          COMMITS=$(git log --pretty=format:'%s' "$RANGE")
          declare -A SECTION_HEADINGS=(
            [feat]="### Features"
            [fix]="### Fixes"
            [ui]="### UI"
            [docs]="### Docs"
            [build]="### Build"
            [chore]="### Chores"
          )
          ORDER=(feat fix ui docs build chore)

          NOTES_FILE=$(mktemp)
          {
            if [ -n "$CHANGELOG_BODY" ]; then
              printf '%s\n' "$CHANGELOG_BODY"
              echo
            else
              echo "## What changed"
              echo
              echo "_(No CHANGELOG.md section found for ${TAG}. See commits below.)_"
              echo
            fi

            echo "## Commits since ${PREV_TAG:-the beginning}"
            echo
            for type in "${ORDER[@]}"; do
              MATCHES=$(printf '%s\n' "$COMMITS" | grep -E "^${type}(\([a-z0-9+_.-]+\))?:" || true)
              if [ -n "$MATCHES" ]; then
                echo "${SECTION_HEADINGS[$type]}"
                echo
                printf '%s\n' "$MATCHES" | sed 's/^/- /'
                echo
              fi
            done
            UNCLASSIFIED=$(printf '%s\n' "$COMMITS" | grep -Ev "^(feat|fix|ui|docs|build|chore)(\([a-z0-9+_.-]+\))?:" || true)
            if [ -n "$UNCLASSIFIED" ]; then
              echo "### Other"
              echo
              printf '%s\n' "$UNCLASSIFIED" | sed 's/^/- /'
              echo
            fi

            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}"
            echo '```'
            echo
            echo "Pin to the release commit for byte-stable rollback:"
            echo '```'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA:0:7}"
            echo '```'

            if [ -n "$COMPARE" ]; then
              echo
              echo "**Full diff:** $COMPARE"
            fi
          } > "$NOTES_FILE"

          # Pass the multi-line body to a later step via the file path,
          # avoiding GITHUB_OUTPUT escaping headaches.
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: false
          # Don't fail the workflow if the release already exists; just update it.
          fail_on_unmatched_files: false
